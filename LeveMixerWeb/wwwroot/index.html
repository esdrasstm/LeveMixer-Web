<!DOCTYPE html>
<html lang="pt-BR" data-theme="system" data-scheme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Volum</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main id="card" class="card">

    <!-- Cabeçalho: logo + nome + configurações + minimizar -->
    <header class="header">
      <!-- Para usar sua logo: troque este <svg> por <img class="logo" src="logo.png" alt=""> -->
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <defs>
          <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#9b82ff"/>
            <stop offset="1" stop-color="#6a4cf5"/>
          </linearGradient>
        </defs>
        <circle cx="16" cy="16" r="15.5" fill="url(#logoGrad)"/>
        <g stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".95">
          <line x1="9.5"  y1="8" x2="9.5"  y2="24"/>
          <line x1="16"   y1="8" x2="16"   y2="24"/>
          <line x1="22.5" y1="8" x2="22.5" y2="24"/>
        </g>
        <g fill="#fff">
          <circle cx="9.5"  cy="19.5" r="3.4"/>
          <circle cx="16"   cy="11.5" r="3.4"/>
          <circle cx="22.5" cy="17"   r="3.4"/>
        </g>
      </svg>
      <span class="brand">Volum</span>

      <button id="settingsBtn" class="icon-btn" title="Configurações" data-i18n-title="settings" aria-expanded="false">
        <svg class="chevron" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M3.5 6l4.5 4.5L12.5 6" fill="none" stroke="currentColor" stroke-width="1.6"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <!-- Minimizar: esconde o mixer (volta para a bandeja) -->
      <button id="minimizeBtn" class="icon-btn" title="Minimizar" data-i18n-title="minimize">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M3.5 8h9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </header>

    <!-- Configurações (abre deslizando para baixo) -->
    <section id="settings" class="settings" inert>
      <div class="settings-inner">
        <div class="panel settings-panel">

          <div class="label" data-i18n="theme">Tema</div>
          <div class="segmented" id="themeSeg" role="radiogroup" aria-label="Tema" data-i18n-aria="theme">
            <button data-value="system" role="radio" aria-checked="true" data-i18n="system">Sistema</button>
            <button data-value="dark"   role="radio" aria-checked="false" data-i18n="dark">Escuro</button>
            <button data-value="light"  role="radio" aria-checked="false" data-i18n="light">Claro</button>
          </div>

          <!-- Os nomes dos idiomas ficam sempre no próprio idioma -->
          <div class="label label-gap" data-i18n="language">Idioma</div>
          <div class="segmented" id="langSeg" role="radiogroup" aria-label="Idioma" data-i18n-aria="language">
            <button data-value="pt" role="radio" aria-checked="true">Português</button>
            <button data-value="en" role="radio" aria-checked="false">English</button>
            <button data-value="es" role="radio" aria-checked="false">Español</button>
          </div>

          <div class="setting-row">
            <span class="setting-text" data-i18n="autostart">Iniciar com o Windows</span>
            <label class="switch">
              <input id="autostart" type="checkbox">
              <span></span>
            </label>
          </div>

          <div class="setting-row">
            <span class="setting-text">
              <span data-i18n="lite">Modo leve</span>
              <small data-i18n="liteHint">Desliga vidro, brilhos e animações</small>
            </span>
            <label class="switch">
              <input id="lite" type="checkbox">
              <span></span>
            </label>
          </div>

          <!-- Novas configurações entram aqui -->
        </div>
      </div>
    </section>

    <!-- Volume geral + microfone (a linha do microfone some se não houver microfone) -->
    <section class="panel master">
      <div id="master"></div>
      <div id="mic" class="mic" hidden>
        <div id="micRow"></div>
        <!-- Escolher o microfone: nome do atual, discreto; o clique abre a lista dos conectados -->
        <div class="mic-picker">
          <button id="micPickBtn" class="mic-current" aria-expanded="false"
                  title="Escolher microfone" data-i18n-title="micPick">
            <span id="micCurrent"></span>
            <svg class="chevron" viewBox="0 0 16 16" aria-hidden="true">
              <path d="M4 6.5l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div id="micList" class="mic-list" inert>
            <div class="mic-list-inner" role="listbox"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Apps -->
    <div class="section-label">
      <span data-i18n="apps">Aplicativos</span>
      <span id="appCount" class="count">0</span>
    </div>
    <section id="apps" class="apps"></section>
    <p id="empty" class="empty" hidden data-i18n="empty">Nenhum app usando áudio agora</p>

  </main>

  <script src="app.js"></script>
</body>
</html>
